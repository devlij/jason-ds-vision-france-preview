<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R2 Pilot Test - France Gallery</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
  h1 { color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
  .card { background: #16213e; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: auto; display: block; }
  .card .label { padding: 10px; font-size: 14px; }
  .status { padding: 10px; background: #0f3460; border-radius: 4px; margin: 10px 0; }
</style>
</head>
<body>
<h1>🇫🇷 R2 Pilot Test - France Gallery</h1>
<div class="status" id="status">Loading images from Cloudflare R2...</div>
<div class="grid" id="grid"></div>
<script>
const R2_BASE = "https://pub-6b6ccf4ce7144393b550da38db7c1f12.r2.dev";
const scenes = [
  {id: "fr-01-001", name: "Eiffel Tower, Paris"},
  {id: "fr-01-002", name: "Louvre Pyramid, Paris"},
  {id: "fr-01-003", name: "Notre-Dame, Paris"},
  {id: "fr-01-004", name: "Arc de Triomphe, Paris"},
];
let loaded = 0, failed = 0;
const grid = document.getElementById('grid');
const status = document.getElementById('status');

scenes.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.src = `${R2_BASE}/assets/${s.id}-16x9.png`;
  img.alt = s.name;
  img.onload = () => {
    loaded++;
    updateStatus();
  };
  img.onerror = () => {
    failed++;
    updateStatus();
  };
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = s.name + ' (via R2)';
  card.appendChild(img);
  card.appendChild(label);
  grid.appendChild(card);
});

function updateStatus() {
  const total = loaded + failed;
  if (total === scenes.length) {
    if (failed === 0) {
      status.innerHTML = `✅ <strong>R2 PILOT SUCCESS:</strong> All ${loaded} images loaded from Cloudflare R2.`;
      status.style.background = '#1b5e20';
    } else {
      status.innerHTML = `⚠️ <strong>R2 PILOT PARTIAL:</strong> ${loaded} loaded, ${failed} failed.`;
      status.style.background = '#e65100';
    }
  } else {
    status.textContent = `Loading... ${total}/${scenes.length}`;
  }
}
</script>
</body>
</html>
